[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-research-skill"
version = "0.2.0"
description = "Evidence-grounded paper research with hybrid retrieval"
requires-python = ">=3.12"
dependencies = ["pypdf==6.21.4", "torch==2.14.1", "sentence-transformers==6.2.0", "transformers==5.22.1", "langgraph==1.2.20", "deepagents==0.7.35", "langchain==1.4.9", "langchain-openai==1.7.4", "fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "rank-bm25==0.2.2", "python-multipart==0.0.33", "gepa==0.1.4"]

[tool.setuptools]
packages = ["paper_research", "research_loop", "research_loop.agent"]

[project.scripts]
paper-research = "paper_research.__main__:main"
research-loop = "research_loop.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
